# EVR Power ERP: one public base URL (/api/v1) routed to four services (hrms-service docs/AUTH_INTEGRATION.md section 5).
# The service-to-service paths (/internal/*, /.well-known/jwks.json) are reachable only on the internal network:
# services call each other directly (http://identity:8001, ...), never through this proxy.

upstream hrms          { server hrms:8000; }
upstream identity      { server identity:8001; }
upstream platform      { server platform:8002; }
upstream manufacturing { server manufacturing:8003; }

map $http_x_request_id $evr_request_id { default $http_x_request_id; "" $request_id; }

server {
    listen 443 ssl http2;
    server_name erp.example.com;                      # CHANGE: the company host name
    ssl_certificate     /etc/nginx/tls/fullchain.pem; # CHANGE: certificate paths
    ssl_certificate_key /etc/nginx/tls/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    client_max_body_size 30m;                         # employee documents and imports

    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $evr_request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Never public.
    location /internal/             { return 404; }
    location /.well-known/          { return 404; }

    # Sign-in: also rate-limit here (Identity's own limit is per process).
    location = /api/v1/auth/login   { limit_req zone=login burst=10 nodelay; proxy_pass http://identity; }

    # Identity: sign-in, users, roles, permission catalogue.
    location /api/v1/auth/              { proxy_pass http://identity; }
    location /api/v1/admin/users        { proxy_pass http://identity; }
    location /api/v1/admin/roles        { proxy_pass http://identity; }
    location /api/v1/admin/permissions  { proxy_pass http://identity; }

    # Platform: company settings, integrations, audit log, overview, notifications.
    location /api/v1/admin/settings     { proxy_pass http://platform; }
    location /api/v1/admin/integrations { proxy_pass http://platform; }
    location /api/v1/admin/audit-events { proxy_pass http://platform; }
    location /api/v1/admin/overview     { proxy_pass http://platform; }
    location /api/v1/notifications      { proxy_pass http://platform; }

    # Manufacturing: dashboard and production.
    location /api/v1/dashboard          { proxy_pass http://manufacturing; }
    location /api/v1/production/        { proxy_pass http://manufacturing; }

    # HRMS: everything under /hr and the HR-owned administration screens.
    location /api/v1/hr/                     { proxy_pass http://hrms; }
    location /api/v1/admin/departments       { proxy_pass http://hrms; }
    location /api/v1/admin/designations      { proxy_pass http://hrms; }
    location /api/v1/admin/reporting-lines   { proxy_pass http://hrms; }
    location /api/v1/admin/workflows         { proxy_pass http://hrms; }
    location /api/v1/admin/workflow-processes { proxy_pass http://hrms; }
    location /api/v1/admin/policies          { proxy_pass http://hrms; }

    location /api/ { return 404; }

    # The React build (npm run build -> dist/).
    root /srv/evr-erp/dist;
    location / { try_files $uri /index.html; }
}

# In the http block:  limit_req_zone $binary_remote_addr zone=login:10m rate=30r/m;

server { listen 80; server_name erp.example.com; return 301 https://$host$request_uri; }
